[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-problem-model"
version = "0.1.0"
description = "2026 数学建模 A 题可复现计算代码"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "xlsxwriter>=3.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
